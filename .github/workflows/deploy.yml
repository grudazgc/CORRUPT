name: Deploy Corrupt.space

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install backend dependencies
        run: |
          cd backend
          npm install
      
      - name: Run backend checks
        run: |
          cd backend
          npm run check

  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Check frontend files
        run: |
          if [ -f "frontend/package.json" ]; then
            cd frontend
            npm install
            npm run build || echo "Frontend build script not configured yet"
          else
            echo "Frontend package.json not found - skipping build"
          fi

  build:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Build backend
        run: |
          cd backend
          npm install
      
      - name: Display build artifacts
        run: |
          echo "✅ Backend build successful"
          echo "📁 Repository structure:"
          ls -la
